<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ordering apps cover</title>
    <!--
      Cover for src/content/work/ordering-apps.md: the Isaac Toast and Paik's Coffee store images side by side,
      with each image's caption band cropped off. Render from the repository root:
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
        --allow-file-access-from-files --window-size=1200,800 --force-device-scale-factor=2 \
        --screenshot=cover.png "file://$PWD/scripts/covers/ordering-apps.html"
      then: sips -s format jpeg -s formatOptions 85 cover.png --out src/assets/work/ordering-apps/cover.jpg
    -->
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 800px; }
      body { background: #ffffff; display: flex; align-items: center; justify-content: center; gap: 80px; }
      .shot { width: 480px; height: 600px; overflow: hidden; }
      .shot img { display: block; width: 480px; margin-top: -205px; }
    </style>
  </head>
  <body>
    <div class="shot"><img src="../../src/assets/work/ordering-apps/isaac-order.jpg" alt="" /></div>
    <div class="shot"><img src="../../src/assets/work/ordering-apps/paik-checkout.png" alt="" /></div>
  </body>
</html>
